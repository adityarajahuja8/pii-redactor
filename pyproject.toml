[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pii-redactor"
version = "1.0.0"
description = "PII redaction tool for .docx files using regex + spaCy NER"
requires-python = ">=3.10"
dependencies = [
    "python-docx",
    "spacy",
    "faker",
    "tqdm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pii_redactor*"]
